<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agents at Work</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="styles.css" />
    <script type="importmap">
      { "imports": { "three": "./vendor/three.module.min.js", "#shared/": "./shared/" } }
    </script>
  </head>
  <body>
    <div id="scene"></div>
    <div id="labels"></div>

    <header id="top-bar">
      <div class="brand">
        <span id="connection" class="connection-dot" data-i18n-title="header.connection"></span>
        <strong data-i18n="page.title">Agents at Work</strong>
        <span class="door-plate" id="project"></span>
      </div>
      <div class="top-bar-actions">
        <button id="recenter" class="button hidden" type="button" data-i18n="header.recenter">
          ⟲ Recenter
        </button>
        <button id="sound" class="button sound-toggle" type="button"></button>
        <div id="language" class="language-switcher" role="group"></div>
      </div>
    </header>

    <div id="session-ended" class="notice hidden" data-i18n="notice.sessionEnded">Session ended</div>

    <aside id="panel" aria-live="polite"></aside>

    <footer id="legend">
      <span data-i18n="legend.reading"></span>
      <span data-i18n="legend.editing"></span>
      <span data-i18n="legend.terminal"></span>
      <span data-i18n="legend.web"></span>
      <span data-i18n="legend.mcp"></span>
      <span data-i18n="legend.planning"></span>
      <span data-i18n="legend.thinking"></span>
      <span data-i18n="legend.waiting"></span>
      <span class="hint" data-i18n="legend.hint"></span>
    </footer>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
